<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ant Farm — Live Agent Activity</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐜</text></svg>" />
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#12140f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ant Farm" />
  </head>
  <body>
    <header class="topbar">
      <h1><span class="logo">🐜</span> Ant Farm</h1>
      <p class="subtitle">watching your coding agents work, live</p>
      <div class="controls">
        <span id="connection-status" class="status-pill status-connecting">connecting…</span>
        <button id="pip-btn" class="pip-btn" title="Float the colony in a corner window over other apps">⤡ Minimize</button>
        <button id="seed-btn" class="seed-btn">Seed demo colony</button>
      </div>
    </header>
    <main id="farm"></main>
    <footer class="legend" id="legend"></footer>
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/pip.js"></script>
  </body>
</html>
